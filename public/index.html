<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parla con l'Arte — Coming soon</title>
    <meta
      name="description"
      content="Parla con l'Arte: dialoga con le opere d'arte attraverso la voce. In arrivo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e0c0a;
        --fg: #f3ece1;
        --muted: #a89c89;
        --accent: #c9a25f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background-image: radial-gradient(
          120% 120% at 50% 0%,
          #1a1611 0%,
          #0e0c0a 60%
        );
        overflow: hidden;
      }
      .wrap {
        max-width: 560px;
        animation: rise 1s ease both;
      }
      .eyebrow {
        font-size: 0.78rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 28px;
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: clamp(2.4rem, 7vw, 4rem);
        line-height: 1.05;
        margin-bottom: 20px;
      }
      h1 em {
        font-style: italic;
        color: var(--accent);
      }
      p {
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.12rem);
        line-height: 1.6;
        max-width: 44ch;
        margin: 0 auto;
      }
      .rule {
        width: 56px;
        height: 1px;
        background: var(--accent);
        opacity: 0.6;
        margin: 36px auto 0;
      }
      .soon {
        margin-top: 18px;
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="eyebrow">Parla con l'Arte</div>
      <h1>Le opere stanno per <em>prendere voce</em></h1>
      <p>
        Un'esperienza dove l'arte racconta sé stessa. Il Maestro Antonio Canova
        vi guiderà attraverso <em>Amore e Psiche</em>. Presto online.
      </p>
      <div class="rule"></div>
      <div class="soon">Coming soon</div>
    </main>
  </body>
</html>
